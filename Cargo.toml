[package]
name = "mcsa"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minecraft Server Alerter: pings a Minecraft Java server and posts to a Discord webhook when it goes down or comes back up"

[dependencies]
anyhow = "1"
inquire = "0.9"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
